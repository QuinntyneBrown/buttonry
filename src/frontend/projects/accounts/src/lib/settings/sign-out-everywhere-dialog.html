<bt-dialog heading="Sign out everywhere?" icon="info">
  <span description>Every device, including this one, will need to sign in again.</span>
  @if (state() === 'failed') {
    <bt-alert top tone="danger" heading="Couldn’t sign you out"
      >Try again. <span class="ref">{{ failure() }}</span></bt-alert
    >
  }
  <ng-container ngProjectAs="[footer]">
    <button btButton type="button" [disabled]="state() === 'busy'" (click)="ref.close()">Cancel</button>
    <button btButton="primary" type="button" data-autofocus [busy]="state() === 'busy'" (click)="submit()">
      {{ state() === 'failed' ? 'Try again' : 'Sign out everywhere' }}
    </button>
  </ng-container>
</bt-dialog>
